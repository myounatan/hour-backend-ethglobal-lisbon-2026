[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hour-rewards-sdk"
version = "0.3.0"
description = "Punch-card rewards schema for venue loyalty programs (SQLModel), with Hedera HTS/HCS punch cards"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matthew Younatan" }]
dependencies = ["sqlmodel>=0.0.22", "sqlalchemy>=2.0"]

# Only `hour_rewards.migrations` needs Alembic, and only `hour_rewards.hedera` needs the
# Hedera SDK; importing the models needs neither.
[project.optional-dependencies]
migrations = ["alembic>=1.13"]
hedera = ["hiero-sdk-python==0.2.9"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/myounatan/hour-backend-ethglobal-lisbon-2026"

[tool.setuptools.packages.find]
where = ["."]
include = ["hour_rewards*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = "hiero_sdk_python.*"
ignore_missing_imports = true
