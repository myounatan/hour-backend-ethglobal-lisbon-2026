[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hour-rewards-sdk"
version = "0.1.0"
description = "Punch-card rewards schema for venue loyalty programs (SQLModel)"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matthew Younatan" }]
dependencies = ["sqlmodel>=0.0.22", "sqlalchemy>=2.0"]

# Only `hour_rewards.migrations` needs Alembic; importing the models does not.
[project.optional-dependencies]
migrations = ["alembic>=1.13"]

[project.urls]
Homepage = "https://github.com/myounatan/hour-backend-ethglobal-lisbon-2026"

[tool.setuptools.packages.find]
where = ["."]
include = ["hour_rewards*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
